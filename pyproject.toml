[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-predictor"
version = "0.3.0"
description = "Predicción de puntos de jugadores NBA y gestión de apuestas en papel"
requires-python = ">=3.10"
dependencies = [
    "xgboost",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "streamlit>=1.60",
    "authlib>=1.3.2",
    "requests",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["nba_predictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
