# Corre las pruebas en cada pull request y en cada push a main y develop.
# Detecta el stack (Node, Python, Go, Rust). Ajusta los comandos a tu proyecto si hace falta.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Node · instalar, lint, pruebas y build
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; PM=pnpm
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable; PM=yarn
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then npm i -g bun && bun install --frozen-lockfile; PM=bun
          elif [ -f package-lock.json ]; then npm ci; PM=npm
          else npm install; PM=npm; fi
          for script in lint test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)"; then $PM run $script; fi
          done

      - name: Python
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Python · instalar y pruebas
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi
          pip install pytest
          pytest

      - name: Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go · pruebas
        if: hashFiles('go.mod') != ''
        run: go vet ./... && go test ./...

      - name: Rust · pruebas
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --all
